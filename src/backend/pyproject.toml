[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "humdg-backend"
version = "0.8.5"
description = "H-UMDG Hospital Unified Master Data Governance Platform API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "redis>=5,<6",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "pydantic-settings>=2.2,<3",
    "py7zr>=0.22,<1",
    "PyJWT[crypto]>=2.9.0",
    "bcrypt>=4.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
humdg-api = "app.main:run_dev"
hudmp-api = "app.main:run_dev"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["../../tests", "tests"]
pythonpath = ["."]
