services:
  postgres:
    image: postgres:16-alpine
    container_name: humdg-postgres
    environment:
      POSTGRES_DB: umdg
      POSTGRES_USER: umdg
      POSTGRES_PASSWORD: umdg
    ports:
      - "5432:5432"
    volumes:
      - humdg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umdg -d umdg"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: humdg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: humdg-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://umdg:umdg@postgres:5432/umdg
      REDIS_URL: redis://redis:6379/0
      API_KEY: change-me
      CORS_ORIGINS: http://127.0.0.1:5101,http://localhost:5101
      UMDG_REPO_ROOT: /workspace
      UMDG_IMPORT_SPOOL_DIR: /tmp/humdg-import-spool
    ports:
      - "8101:8101"
    volumes:
      - ../../data:/workspace/data:ro

volumes:
  humdg-postgres-data:
